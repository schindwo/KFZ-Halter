<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrzeugkontakt</title>
 
<style>
 
*{
box-sizing:border-box;
}
 
body{
margin:0;
padding:20px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f4f4;
color:#333;
}
 
.container{
max-width:600px;
margin:auto;
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
 
h1{
text-align:center;
margin-top:0;
}
 
p{
text-align:center;
line-height:1.5;
}
 
/* Grund-Auswahl */
 
.reason-buttons{
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:20px;
}
 
.reason-buttons input[type="radio"]{
display:none;
}
 
.reason{
display:block;
padding:22px;
border:2px solid #d0d0d0;
border-radius:12px;
background:#fafafa;
font-size:22px;
font-weight:bold;
text-align:center;
cursor:pointer;
transition:all .2s ease;
}
 
.reason:hover{
background:#eef6ff;
}
 
.reason-buttons input[type="radio"]:checked + .reason{
background:#0078d7;
color:white;
border-color:#0078d7;
}
 
/* Eingabefelder */
 
label{
display:block;
margin:18px 0 8px;
font-weight:bold;
font-size:18px;
}
 
textarea,
input[type="text"]{
width:100%;
padding:16px;
border:1px solid #cccccc;
border-radius:10px;
font-size:18px;
}
 
textarea{
min-height:140px;
resize:vertical;
}
 
/* Riesenbutton */
 
button{
width:100%;
min-height:130px;
margin-top:30px;
border:none;
border-radius:14px;
background:#28a745;
color:white;
font-size:30px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
 
button:hover{
background:#218838;
}
 
button:active{
transform:scale(0.98);
}
 
.info{
text-align:center;
margin-top:15px;
font-size:14px;
color:#666;
}
 
@media (prefers-color-scheme: dark){
 
body{
background:#101010;
color:#f0f0f0;
}
 
.container{
background:#222;
}
 
textarea,
input[type="text"]{
background:#333;
color:white;
border-color:#555;
}
 
.reason{
background:#333;
color:white;
border-color:#555;
}
 
.reason:hover{
background:#444;
}
 
.info{
color:#aaa;
}
}
 
</style>
</head>
 
<body>
 
<div class="container">
 
<h1>🚐 Fahrzeugkontakt</h1>
 
<p>
Haben Sie ein Anliegen zu diesem Fahrzeug?<br>
Bitte kurz beschreiben.
</p>
 
https://formspree.io/f/DEINE_FORM_ID
 
<div class="reason-buttons">
 
<input
type="radio"
id="licht"
name="Grund"
value="Licht eingeschaltet"
checked>
 
<label class="reason" for="licht">
💡 Licht eingeschaltet
</label>
 
<input
type="radio"
id="beschaedigt"
name="Grund"
value="Fahrzeug beschädigt">
 
<label class="reason" for="beschaedigt">
🚗 Fahrzeug beschädigt
</label>
 
<input
type="radio"
id="parkproblem"
name="Grund"
value="Parkproblem">
 
<label class="reason" for="parkproblem">
🅿️ Parkproblem
</label>
 
<input
type="radio"
id="unfall"
name="Grund"
value="Unfall / Vorfall">
 
<label class="reason" for="unfall">
⚠️ Unfall / Vorfall
</label>
 
<input
type="radio"
id="sonstiges"
name="Grund"
value="Sonstiges">
 
<label class="reason" for="sonstiges">
ℹ️ Sonstiges
</label>
 
</div>
 
<label for="nachricht">
Nachricht
</label>
 
<textarea
id="nachricht"
name="Nachricht"
placeholder="Bitte kurz beschreiben ..."
required></textarea>
 
<label for="kontakt">
E-Mail oder Telefon (optional)
</label>
 
<input
type="text"
id="kontakt"
name="Kontakt"
placeholder="Für Rückfragen">
 
<input
type="hidden"
id="gps"
name="Standort">
 
<input
type="hidden"
name="_subject"
value="🚐 Fahrzeugmeldung">
 
<input
type="text"
name="_gotcha"
style="display:none">
 
<button type="submit">
🚐<br>
Fahrzeughalter<br>
informieren
</button>
 
</form>
 
<div class="info">
Ihre Nachricht wird direkt an den Fahrzeughalter gesendet.
</div>
 
</div>
 
<script>
 
if(navigator.geolocation){
 
navigator.geolocation.getCurrentPosition(
function(position){
 
document.getElementById("gps").value =
position.coords.latitude +
", " +
position.coords.longitude;
 
}
);
 
}
 
</script>
 
</body>
</html>
