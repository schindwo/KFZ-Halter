<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
 
<title>Fahrzeugkontakt</title>
 
<style>
 
* {
box-sizing: border-box;
}
 
body {
margin: 0;
padding: 20px;
font-family: Arial, Helvetica, sans-serif;
background: #f5f5f5;
color: #333;
}
 
.container {
max-width: 550px;
margin: 0 auto;
padding: 24px;
background: #ffffff;
border-radius: 15px;
box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
 
h1 {
text-align: center;
margin-top: 0;
}
 
p {
text-align: center;
line-height: 1.5;
font-size: 18px;
}
 
label {
display: block;
margin-top: 20px;
margin-bottom: 8px;
font-weight: bold;
font-size: 18px;
}
 
textarea,
input[type="text"] {
width: 100%;
padding: 16px;
border: 1px solid #ccc;
border-radius: 10px;
font-size: 18px;
}
 
textarea {
min-height: 140px;
resize: vertical;
}
 
/* Grund-Auswahl */
 
.reason-buttons {
display: flex;
flex-direction: column;
gap: 12px;
}
 
.reason-buttons input[type="radio"] {
display: none;
}
 
.reason {
display: block;
padding: 18px;
border: 2px solid #cccccc;
border-radius: 12px;
background: #f8f8f8;
text-align: center;
font-size: 20px;
font-weight: bold;
cursor: pointer;
transition: all 0.2s;
}
 
.reason:hover {
background: #eef6ff;
}
 
.reason-buttons input[type="radio"\]:checked + .reason {
background: #0078d7;
color: white;
border-color: #0078d7;
}
 
/* Senden-Button */
 
button {
width: 100%;
min-height: 110px;
padding: 25px;
margin-top: 30px;
border: 2px solid #28a745;
border-radius: 12px;
background: #28a745;
color: white;
font-size: 28px;
font-weight: bold;
cursor: pointer;
transition: all 0.2s ease;
}
 
button:hover {
background: #218838;
border-color: #218838;
}
 
button:active {
transform: scale(0.98);
}
 
.info {
margin-top: 15px;
text-align: center;
color: #666;
font-size: 14px;
}
 
@media (prefers-color-scheme: dark) {
 
body {
background: #181818;
color: #f0f0f0;
}
 
.container {
background: #2a2a2a;
}
 
textarea,
input[type="text"] {
background: #3a3a3a;
color: white;
border-color: #555;
}
 
.reason {
background: #3a3a3a;
border-color: #555;
color: white;
}
 
.reason:hover {
background: #454545;
}
 
.info {
color: #aaa;
}
}
 
</style>
</head>
 
<body>
 
<div class="container">
 
<h1>🚐 Fahrzeugkontakt</h1>
 
<p>
Haben Sie ein Anliegen zu diesem Fahrzeug?<br>
Bitte beschreiben Sie Ihr Anliegen kurz.
</p>
 
https://formspree.io/f/mwlpavol
 
<label>Grund</label>
 
<div class="reason-buttons">
 
<input
type="radio"
id="licht"
name="Grund"
value="Licht eingeschaltet"
checked>
 
<label class="reason" for="licht">
💡 Licht eingeschaltet
</label>
 
<input
type="radio"
id="beschaedigt"
name="Grund"
value="Fahrzeug beschädigt">
 
<label class="reason" for="beschaedigt">
🚗 Fahrzeug beschädigt
</label>
 
<input
type="radio"
id="parkproblem"
name="Grund"
value="Parkproblem">
 
<label class="reason" for="parkproblem">
🅿️ Parkproblem
</label>
 
<input
type="radio"
id="unfall"
name="Grund"
value="Unfall / Vorfall">
 
<label class="reason" for="unfall">
⚠️ Unfall / Vorfall
</label>
 
<input
type="radio"
id="sonstiges"
name="Grund"
value="Sonstiges">
 
<label class="reason" for="sonstiges">
ℹ️ Sonstiges
</label>
 
</div>
 
<label for="nachricht">Nachricht</label>
 
<textarea
id="nachricht"
name="Nachricht"
placeholder="Bitte kurz beschreiben..."
required></textarea>
 
<label for="kontakt">
E-Mail oder Telefon (optional)
</label>
 
<input
type="text"
id="kontakt"
name="Kontakt"
placeholder="Für Rückfragen">
 
<input
type="hidden"
id="gps"
name="Standort">
 
<input
type="text"
name="_gotcha"
style="display:none">
 
<input
type="hidden"
name="_subject"
value="🚐 Fahrzeugmeldung">
 
<button type="submit">
🚐 Fahrzeughalter informieren
</button>
 
</form>
 
<div class="info">
Ihre Nachricht wird direkt an den Fahrzeughalter gesendet.
</div>
 
<div>
 
<script>
 
if ("geolocation" in navigator) {
 
navigator.geolocation.getCurrentPosition(
 
function(position) {
 
document.getElementById("gps").value =
position.coords.latitude +
", " +
position.coords.longitude;
 
},
 
function(error) {
 
console.log(
"GPS nicht verfügbar:",
error.message
);
 
}
 
);
 
}
 
</script>
 
</body>
</html>
